<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write Tools</title>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="home2.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9M10 19v-5h4v5"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><path d="M4 8h13v11H4zM7 5h13v11"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8 12.5l2.7 2.7L16 9.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M15 8a4 4 0 1 0-3 3.9L11 15H9v2H7v2H4v-3l7.1-7.1"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 4v14l4-3 3 5 2-1-3-5h5z"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6zM9 12l2 2 4-4"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 12l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v10H9zM5 15V5h10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></symbol>
</svg>

<div id="app">
  <aside id="side">
    <div class="traffic drag"></div>
    <div class="brand"><div class="logo" id="logo"><img src="../assets/logo.png" alt="" draggable="false"></div><div><b>Write Tools</b><span id="ver">wersja 1.3</span></div></div>
    <nav id="nav">
      <i id="pill"></i>
      <button data-p="start" class="on"><svg class="i"><use href="#i-home"/></svg><span>Start</span></button>
      <button data-p="chat"><svg class="i"><use href="#i-chat"/></svg><span>Czat</span></button>
      <button data-p="study"><svg class="i"><use href="#i-cards"/></svg><span>Fiszki i quizy</span><em id="dueBadge" hidden></em></button>
      <button data-p="stats"><svg class="i"><use href="#i-chart"/></svg><span>Statystyki</span></button>
      <button data-p="actions"><svg class="i"><use href="#i-edit"/></svg><span>Edytor akcji</span></button>
      <button data-p="people"><svg class="i"><use href="#i-user"/></svg><span>Personalizacja</span></button>
      <button data-p="perms"><svg class="i"><use href="#i-shield"/></svg><span>Zgody systemowe</span><em id="permBadge" hidden></em></button>
      <button data-p="settings"><svg class="i"><use href="#i-sliders"/></svg><span>Ustawienia</span><em id="updBadge" class="blue" hidden>1</em></button>
    </nav>
    <div class="sfoot"><kbd id="hk">⌘⌥M</kbd><small>menu przy zaznaczonym tekście</small></div>
  </aside>
  <main id="main">
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="drag topbar"></div>
    <div id="upd" class="upd glass" hidden></div>
    <section class="page" id="p-start" hidden></section>
    <section class="page" id="p-chat" hidden></section>
    <section class="page" id="p-study" hidden></section>
    <section class="page" id="p-stats" hidden></section>
    <section class="page" id="p-actions" hidden></section>
    <section class="page" id="p-people" hidden></section>
    <section class="page" id="p-perms" hidden></section>
    <section class="page" id="p-settings" hidden></section>
    <div id="session" hidden></div>
  </main>
</div>
<script src="home.js"></script>
<script src="home-chat.js"></script>
<script src="home-actions.js"></script>
<script src="home-perms.js"></script>
<script src="home-settings.js"></script>
</body>
</html>
