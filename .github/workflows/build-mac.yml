name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Write-Mode-Tool-mac
          path: dist/*.dmg
      - name: Publish release with the dmg files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "Write Mode Tool 1.0.0" --notes "Pliki dmg dla Maca: arm64 (Apple Silicon) i x64 (Intel)."
          gh release upload v1.0.0 dist/*.dmg --clobber
