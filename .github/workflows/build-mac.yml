name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Write-Tools-mac
          path: dist/*.dmg
      - name: Publish release with the dmg files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Write Tools $V" --notes "Write Tools $V dla Maca. Pliki dmg: Write-Tools-arm64.dmg (Apple Silicon) i Write-Tools-x64.dmg (Intel)." --latest
          gh release upload "v$V" dist/*.dmg --clobber
