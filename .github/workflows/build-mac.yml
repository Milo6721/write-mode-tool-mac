name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Write-Mode-Tool-mac
          path: dist/*.dmg
