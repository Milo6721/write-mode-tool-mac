name: Test on macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run the app in smoke-test mode (checks plus screenshots of every screen)
        env:
          WT_SMOKE: "1"
          WT_SMOKE_SHOTS: ${{ runner.temp }}/shots
          WT_SMOKE_OUT: ${{ runner.temp }}/shots/smoke.json
          ANTHROPIC_API_KEY: sk-ant-api03-FAKEFAKEFAKEFAKEFAKEFAKE
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          npx electron . --no-sandbox || echo "electron exit code $?"
          cat "$RUNNER_TEMP/shots/smoke.json" || true
          ls -la "$RUNNER_TEMP/shots" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: ${{ runner.temp }}/shots/*
